name: voltsync-vpp

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: voltsync-vpp:latest
    container_name: voltsync-api
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: voltsync-vpp:latest
    container_name: voltsync-ui
    command:
      [
        "streamlit",
        "run",
        "frontend/app.py",
        "--server.port",
        "8501",
        "--server.address",
        "0.0.0.0",
        "--server.headless",
        "true",
        "--browser.gatherUsageStats",
        "false",
      ]
    environment:
      PYTHONUNBUFFERED: "1"
      VOLTSYNC_API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
